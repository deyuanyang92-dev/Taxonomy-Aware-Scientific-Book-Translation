# 检索表（dichotomous key）偶句重建规则：只读 OCR 行框，零 token。
# 改规则不改代码；语法见 docstore/keys.py 顶部 docstring。
# 所有正则是 Python re 语法；@LD@ 换成 [chars].leader，@PR@ 换成 [chars].prime（TOML 单引号串里不能含撇号）。

[chars]
# 条目行里单独成框的「—」类横线（OCR 常把破折号识别成这些字符）
dash = "—一－–-―"
# 点线（leader dots）字符集，写进正则的字符类里
leader = '\.．…·。,'
# 撇号类字符（N' 的 '），OCR 会写成多种形状
prime = "'’′‘ʼ"

[patterns]
# 单独成框的条目号：「3.」「12．」
lead_num = '^(\d{1,3})[@LD@、]*$'
# 条目号与正文并成一框：「3．体は…」
lead_merged = '^(\d{1,3})[\.．。]{1,3}(?=\D)(.+)$'
# 内联型（2009 卷）：「3.正文」「3'.正文」
inline = '^(\d{1,3})\s*([@PR@]*)\s*[\.．。]\s*(?=[^\d\s])(.*)$'
# 右栏终点：纯跳转号 / 「名称……号」 / 「类群……学名（図 N）」
jump = '^[@LD@]*\s*(\d{1,3})$'
tail_jump = '^(.*?)[@LD@]{2,}\s*(\d{1,3})$'
name_jump = '^(.*?[A-Za-z\)）])\s*[@LD@]{2,}\s*(\d{1,3})$'
group_taxon = '^(.*?)\s*[@LD@]{2,}\s*(.*(?:[（(]図\s?\d+[）)]|[A-Z][a-z]+ ?[a-z]{3,}))$'
# 检索表标题行（短行）；在标题上方的行属于上一张表的续页
heading = '検索|Key to|KEY TO'
# 图题/文献起头：结束当前检索表
caption = '^(図|表|Fig\.?|Table)\s*[A-Z0-9]+\s*[\.．:：]|^引用文献|^文献'
# 终点是否像分类名：拉丁学名、亚科/科/属、（図 N）
taxon = '[A-Z][a-z]+(?: [a-z]+)?|亜科|科$|属$|[（(]図\s?\d+[）)]'

[geometry]
# 以下数值是页宽 W 的比例，由日文 2001/2007/2009 三卷实测（见 issue #38）
heading_max_chars = 30           # 标题行最长字数
heading_max_width = 0.6          # 标题行最宽
marker_max_width = 0.06          # 条目号框最宽
marker_zone = 0.2                # 条目号只会出现在页宽左侧这一段
lead_left = 0.02                 # 条目栏左界 = Tm − lead_left·W
lead_right = 0.006               # 条目栏右界 = Tm − lead_right·W
margin_bin = 8                   # 文本左缘众数分箱宽（像素）
margin_probe = 0.12              # 条目号右侧取样范围（页宽）
right_edge_pct = 0.93            # 右缘 R = x1 的 93 百分位
right_tol = 0.05                 # x1 ≥ R − right_tol·W 才算「到右缘」
target_far = 0.4                 # 纯跳转号须位于 Tm + 0.4(R−Tm) 之右
indent_tol = 0.05                # 新条目：x0 < Tm + indent_tol·W
inline_tol = 0.03                # 内联条目号：x0 < Tm + inline_tol·W
lost_tol = 0.08                  # 短行判定：x1 < R − lost_tol·W
min_row_chars = 8                # 校准用的最短文本行（全页众数）
min_marker_text = 6              # 校准用的最短文本行（条目号定位）
fallback_x_min = 0.02            # 全页众数只看 x0 大于此比例的行（排除页边噪声）
fallback_margin = 0.13           # 无法校准时 Tm = 0.13·W
# 像素量（200 dpi 页图）
lead_y_pull = 25                 # 条目号行与正文行同序时的 y 修正
lead_y_match = 22                # G8：与条目号 y 相近的行仍是条目正文
heading_slack = 2                # 标题行上下判定余量
pageno_gap = 30                  # 孤立跳转号离条目正文太远 → 页码
new_lead_gap = 14                # 新条目起点相对终点/末行的 y 余量
