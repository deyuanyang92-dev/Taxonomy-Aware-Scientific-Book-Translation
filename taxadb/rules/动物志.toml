# 《中国动物志》物种记述切分规则（按卷33 沙蚕目实际用词写成；其他卷先试跑 split，按 verify 报告增删）
# 正则一律为 Python re 语法；TOML 字面串（单引号）里反斜杠不转义。

[work]
series = "中国动物志 无脊椎动物"
# 各论（物种记述）所在 PDF 页范围；范围外的编号行（总论表格、英文摘要、索引）不当标题
body_pages = [63, 451]
# 印刷页 = PDF 页 + page_offset（卷33 抽查 p93、p105 页眉页码与 PDF 页一致）
page_offset = 0

[inventory]
# 金标准：书中给出的种数。卷33 无目录页（扫描缺前置部分），用英文摘要 p474「203 species」与总论表 2（p32–39，(1)–(203) 连续编号）
expected_species = 203
source = "英文摘要 p474：63 genera, 203 species；总论表 2（p32–39）编号 (1)–(203)"
# 清单表所在 PDF 页与行格式；用于逐号比对种名。留空则只比种数
pages = [32, 39]
line = '^\s*[（(]\s*(?P<num>\d{1,3})\s*[)）]\s*(?P<zh>[^A-Za-z（(]+?)\s*(?P<latin>[A-Z][A-Za-z\s.\-/]*)$'

[heading]
# 种标题：（编号）中文名 学名 命名人, 年份（图 N）。编号连续，全书不按科重排
species = '^\s*[（(]\s*(?P<num>\d{1,3})\s*[)）]?\s*(?P<zh>[^A-Za-z（(\d]{1,24}?)\s*(?P<rest>[A-Z].*)$'
# 中文名后缀（新种、新亚种标注），从中文名中剥去，记入 note
zh_suffix = '\s*[，,、]?\s*(新种|新亚种|新纪录|新记录)$'
# 标题行未写完（缺年份或图号括号未闭合）时，最多并入后续几行
max_wrap_lines = 2
# 记述终止行：属、亚科、科标题，检索表，参考文献
stop = [
  '^\s*\d{1,2}\s*[.．，,、]\s*[^\sA-Za-z]{1,12}属\s*[A-Z]',
  '^\s*[（(][一二三四五六七八九十]+[)）]\s*\S{1,12}亚科',
  '^\s*[一二三四五六七八九十]+\s*[、.．]\s*\S{1,10}科\s*[A-Z]',
  '^\s*\d\s*[.．，,、]\s*\S{1,10}科\s*[A-Z]',
  '^\s*(种|属|亚种|亚属|亚科|科)检索表\s*$',
  '^\s*参考文献\s*$',
]
# 属标题：取属名（拉丁）作切分学名时的属名表
genus = '^\s*\d{1,2}\s*[.．，,、]\s*(?P<zh>[^\sA-Za-z]{1,12}属)\s*(?P<latin>[A-Z][a-z]+)'
# 科、亚科标题：给记述标上所属科、亚科
family = '^\s*[一二三四五六七八九十]+\s*[、.．]\s*(?P<zh>[^\sA-Za-z]{1,10}科)\s*(?P<latin>[A-Z][a-z]+idae)'
subfamily = '^\s*[（(][一二三四五六七八九十]+[)）]\s*(?P<zh>[^\sA-Za-z]{1,12}亚科)\s*(?P<latin>[A-Z][a-z]+inae)'

[sections]
# 小标题 → 字段名。小标题独占一行，或位于行首且上一行以句末标点结束（OCR 常把小标题与正文并成一行）
names = { "标本采集地" = "标本采集地", "形态特征" = "形态特征", "生殖和发育" = "生殖和发育", "地理分布" = "地理分布", "讨论" = "讨论" }
# 每个种都应有的小标题（缺了在 flags 里报）
required = ["标本采集地", "形态特征", "地理分布"]
# OCR 常见变体（行首 2 字 + 至多 2 个错字）
fuzzy = { "标本采" = "标本采集地", "形态特" = "形态特征", "地理分" = "地理分布", "理分布" = "地理分布", "讨论手" = "讨论", "生殖和发" = "生殖和发育" }
# 小标题与正文并行时，上一行须以这些字符结尾
sentence_end = "。．.)）;；"
# 标题与第一个小标题之间为异名列表（synonymy）

[legend]
# 图注：「图 N」开头（其后为空、中文名或学名，不是「图52E），」这类正文引用）
start = '^\s*图\s*\d{1,3}\s*(?:$|[^\dA-Za-z）)，,、。；;：:\s])'
# 图注说明行：字母分项开头，如「A.体前部…」「D一E.第24刚节…」
item = '^\s*[A-Z1Il]\s*(?:[一—\-–]\s*[A-Z]\s*)?[.。，,、:：]?\s*[一-鿿第（(]'
# 上一行图注未以句号结束时，含「：F，」「；B.」这类分项的行仍属图注
inner_item = '[：:；;]\s*[A-Z1Il]\s*(?:[一—\-–]\s*[A-Z]\s*)?[.。，,、]'
# 图注末尾的出处说明
tail = '^\s*[（(](仿|引自|据)'
# 上一行未结束时，短于此长度且以句号结束的行视为图注尾巴
short_tail = 12

[page]
# 页眉（页首若干行内，顺序不定）：书名、门纲目、科属名、页码
header_max_lines = 5
header = [
  '^\d{1,3}$',
  '^《?中国动物志》?$',
  '^环节动物门\s*(多毛纲)?$',
  '^多毛纲\s*(Ⅱ.{0,2}沙蚕.)?$',
  '^[ⅠⅡⅢIl正].{0,2}沙蚕[目自]$',
  '^[^\sA-Za-z\d]{1,10}(科|属|亚科)$',
  '^(总论|各论)$',
]
# 扫描图版上的无义识别串（任意位置的整行）
noise = [
  '^[A-Z]{1,4}$',
  '^[A-Z0-9O]{8,}$',
]

[merge]
# 主版本（300 dpi）之外取一个低 dpi 版本，按字符对齐，补回主版本漏识的短串（OCR 常漏「；」「日」等）。
# 只补「插入」：主版本缺、另一版本有，且长度不超过 max_insert；替换（两版本不同字）保留主版本。
# 整行插入只接受种标题行（主版本整行漏识标题时）。
enabled = true
max_insert = 2

[normalize]
# 只对写入字段的副本做，docstore 页文本不动；每条替换计数写入 treatment.text_note
# 两个数字之间的「一」「-」「--」「~」是 OCR 对原书范围号「—」的误识
range_dash = true
