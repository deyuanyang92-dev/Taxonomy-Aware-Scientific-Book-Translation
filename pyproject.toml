[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docstore"
version = "0.1.0"
description = "Local document store: registry, page text with verification levels, FTS5 search, citations."
requires-python = ">=3.9"
dependencies = ["pymupdf"]

[project.optional-dependencies]
ocr = ["rapidocr_onnxruntime"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
docstore = "docstore.cli:main"
taxadb = "taxadb.cli:main"

[tool.setuptools.packages.find]
include = ["docstore*", "taxadb*", "transqa*"]

[tool.ruff]
line-length = 120

[tool.mypy]
ignore_missing_imports = true
