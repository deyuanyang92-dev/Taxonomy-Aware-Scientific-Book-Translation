<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="1180" height="580" role="img" aria-label="系统架构：资料层经资料管理员进入本地资料库；术语员建术语库；数据整理员建分类数据库；翻译生产线依次经术语表、初译、换模型译审、领域验证、表述核对、主编裁定、闸口，出版员输出译著；读者与审查意见回到主编，主编更新领域包。" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4a44"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f5c"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8641a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="580" fill="#ffffff"/>

  <!-- 四层底带 -->
  <rect x="10" y="12" width="1160" height="100" rx="12" fill="#f4f6f5"/>
  <rect x="10" y="140" width="1160" height="112" rx="12" fill="#eef5f1"/>
  <rect x="10" y="272" width="1160" height="140" rx="12" fill="#f4f6f5"/>
  <rect x="10" y="432" width="1160" height="132" rx="12" fill="#f1f3f8"/>

  <g font-size="13" font-weight="700" fill="#5b6660">
    <text x="26" y="36">① 资料层</text>
    <text x="26" y="164">② 知识底座</text>
    <text x="26" y="182" font-size="11" font-weight="400">单一主库</text>
    <text x="26" y="296">③ 翻译生产线</text>
    <text x="26" y="456">④ 出口</text>
  </g>

  <!-- ① 资料层 -->
  <g>
    <rect x="130" y="40" width="230" height="54" rx="8" fill="#ffffff" stroke="#8a968f"/>
    <text x="245" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2420">外部规范</text>
    <text x="245" y="82" text-anchor="middle" font-size="11.5" fill="#5b6660">名词委 · WoRMS · ANNiKEY</text>

    <rect x="420" y="40" width="300" height="54" rx="8" fill="#ffffff" stroke="#8a968f"/>
    <text x="570" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2420">权威资料（PDF）</text>
    <text x="570" y="82" text-anchor="middle" font-size="11.5" fill="#5b6660">志书 · 名录 · 专著 · 论文 · 对照译本</text>
  </g>

  <!-- ② 知识底座：主库 -->
  <g>
    <rect x="130" y="160" width="230" height="72" rx="10" fill="#e3efe9" stroke="#1f6f5c" stroke-width="1.6"/>
    <text x="245" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#16483c">术语库 yiku</text>
    <text x="245" y="206" text-anchor="middle" font-size="11.5" fill="#2f5d51">定名 · 出处 · 依据等级</text>
    <text x="245" y="222" text-anchor="middle" font-size="11.5" fill="#2f5d51">候选 / 已证 / 已核 / 暂定</text>

    <rect x="420" y="160" width="230" height="72" rx="10" fill="#e3efe9" stroke="#1f6f5c" stroke-width="1.6"/>
    <text x="535" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#16483c">本地资料库 docstore</text>
    <text x="535" y="206" text-anchor="middle" font-size="11.5" fill="#2f5d51">页文本 · 全文检索 · 引注</text>
    <text x="535" y="222" text-anchor="middle" font-size="11.5" fill="#2f5d51">核对等级 · 谁做的</text>

    <rect x="690" y="160" width="220" height="72" rx="10" fill="#ffffff" stroke="#1f6f5c" stroke-dasharray="5 4" stroke-width="1.4"/>
    <text x="800" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#16483c">领域包</text>
    <text x="800" y="206" text-anchor="middle" font-size="11.5" fill="#2f5d51">依据次序 · 本行写法</text>
    <text x="800" y="222" text-anchor="middle" font-size="11.5" fill="#2f5d51">陷阱表 · 验证器</text>

    <rect x="970" y="160" width="180" height="72" rx="10" fill="#e3efe9" stroke="#1f6f5c" stroke-width="1.6"/>
    <text x="1060" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#16483c">分类数据库 taxadb</text>
    <text x="1060" y="206" text-anchor="middle" font-size="11.5" fill="#2f5d51">物种记述 · 名称用法</text>
    <text x="1060" y="222" text-anchor="middle" font-size="11.5" fill="#2f5d51">异名 · 分布</text>
  </g>

  <!-- 资料层 → 知识底座 -->
  <g stroke="#3d4a44" stroke-width="1.5" fill="none">
    <line x1="245" y1="94" x2="245" y2="158" marker-end="url(#ah)"/>
    <line x1="500" y1="94" x2="500" y2="158" marker-end="url(#ah)"/>
    <line x1="420" y1="196" x2="362" y2="196" marker-end="url(#ah)"/>
    <polyline points="620,160 620,126 1060,126 1060,158" marker-end="url(#ah)"/>
  </g>
  <g font-size="11.5" fill="#3d4a44" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
    <text x="253" y="130">术语员</text>
    <text x="508" y="122">资料管理员</text>
    <text x="508" y="138">页面校对员</text>
    <text x="391" y="190" text-anchor="middle">术语员</text>
    <text x="840" y="121" text-anchor="middle">数据整理员：切分记述</text>
  </g>

  <!-- ③ 生产线 -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="125" y="330" width="100" height="60" rx="8" fill="#ffffff" stroke="#3d4a44"/>
    <text x="175" y="356" fill="#1d2420">术语表</text>
    <text x="175" y="374" font-size="11" font-weight="400" fill="#5b6660">缺口查证</text>

    <rect x="243" y="330" width="100" height="60" rx="8" fill="#ffffff" stroke="#3d4a44"/>
    <text x="293" y="356" fill="#1d2420">初译</text>
    <text x="293" y="374" font-size="11" font-weight="400" fill="#5b6660">模型 A</text>

    <rect x="361" y="330" width="100" height="60" rx="8" fill="#ffffff" stroke="#3d4a44"/>
    <text x="411" y="356" fill="#1d2420">双语译审</text>
    <text x="411" y="374" font-size="11" font-weight="400" fill="#5b6660">模型 B ≠ A</text>

    <rect x="479" y="330" width="100" height="60" rx="8" fill="#ffffff" stroke="#3d4a44"/>
    <text x="529" y="356" fill="#1d2420">领域验证</text>
    <text x="529" y="374" font-size="11" font-weight="400" fill="#5b6660">学名·数字·引文</text>

    <rect x="597" y="330" width="100" height="60" rx="8" fill="#ffffff" stroke="#3d4a44"/>
    <text x="647" y="356" fill="#1d2420">表述核对</text>
    <text x="647" y="374" font-size="11" font-weight="400" fill="#5b6660">志书写法</text>

    <rect x="715" y="330" width="100" height="60" rx="8" fill="#fdf1de" stroke="#a8641a" stroke-width="1.8"/>
    <text x="765" y="356" fill="#7a4510">主编裁定</text>
    <text x="765" y="374" font-size="11" font-weight="400" fill="#8a5a22">采纳 / 驳回</text>

    <rect x="833" y="330" width="100" height="60" rx="8" fill="#ffffff" stroke="#3d4a44" stroke-width="1.8"/>
    <text x="883" y="356" fill="#1d2420">闸口</text>
    <text x="883" y="374" font-size="11" font-weight="400" fill="#5b6660">唯一改稿入口</text>
  </g>
  <g stroke="#3d4a44" stroke-width="1.5" fill="none">
    <line x1="225" y1="360" x2="241" y2="360" marker-end="url(#ah)"/>
    <line x1="343" y1="360" x2="359" y2="360" marker-end="url(#ah)"/>
    <line x1="461" y1="360" x2="477" y2="360" marker-end="url(#ah)"/>
    <line x1="579" y1="360" x2="595" y2="360" marker-end="url(#ah)"/>
    <line x1="697" y1="360" x2="713" y2="360" marker-end="url(#ah)"/>
    <line x1="815" y1="360" x2="831" y2="360" marker-end="url(#ah)"/>
  </g>

  <!-- 知识底座 → 生产线 -->
  <g stroke-width="1.5" fill="none">
    <line x1="200" y1="232" x2="178" y2="328" stroke="#1f6f5c" marker-end="url(#ahg)"/>
    <line x1="470" y1="232" x2="305" y2="328" stroke="#1f6f5c" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
    <line x1="720" y1="232" x2="420" y2="328" stroke="#1f6f5c" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
    <line x1="740" y1="232" x2="536" y2="328" stroke="#1f6f5c" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
    <line x1="760" y1="232" x2="652" y2="328" stroke="#1f6f5c" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
    <line x1="780" y1="328" x2="790" y2="234" stroke="#a8641a" stroke-dasharray="5 4" marker-end="url(#aha)"/>
  </g>
  <g font-size="11.5" paint-order="stroke" stroke="#f4f6f5" stroke-width="4" stroke-linejoin="round">
    <text x="200" y="282" fill="#1f6f5c">术语注入</text>
    <text x="356" y="278" fill="#1f6f5c">志书例句</text>
    <text x="655" y="252" text-anchor="end" fill="#1f6f5c">规则 · 陷阱 · 验证器</text>
    <text x="796" y="300" fill="#a8641a">回流：新规则 · 新陷阱</text>
  </g>

  <!-- ④ 出口 -->
  <g text-anchor="middle">
    <rect x="770" y="474" width="226" height="60" rx="8" fill="#ffffff" stroke="#4a5a78" stroke-width="1.4"/>
    <text x="883" y="499" font-size="14" font-weight="700" fill="#24324d">译著</text>
    <text x="883" y="518" font-size="11.5" fill="#4a5a78">Word · PDF · 传播版 · 索引</text>

    <rect x="1010" y="474" width="140" height="60" rx="8" fill="#ffffff" stroke="#4a5a78" stroke-width="1.4"/>
    <text x="1080" y="499" font-size="14" font-weight="700" fill="#24324d">名录</text>
    <text x="1080" y="518" font-size="11.5" fill="#4a5a78">物种汇编</text>
  </g>
  <g stroke-width="1.5" fill="none">
    <line x1="883" y1="390" x2="883" y2="472" stroke="#3d4a44" marker-end="url(#ah)"/>
    <line x1="1080" y1="232" x2="1080" y2="472" stroke="#3d4a44" marker-end="url(#ah)"/>
    <polyline points="770,504 640,504 640,420 750,420 760,392" stroke="#a8641a" stroke-dasharray="5 4" marker-end="url(#aha)"/>
  </g>
  <g font-size="11.5" paint-order="stroke" stroke="#f1f3f8" stroke-width="4" stroke-linejoin="round">
    <text x="891" y="446" fill="#3d4a44">出版员</text>
    <text x="1088" y="446" fill="#3d4a44">导出</text>
    <text x="520" y="508" fill="#a8641a">读者意见 · 外部审查</text>
  </g>

  <!-- 图例 -->
  <g font-size="11" fill="#5b6660">
    <rect x="130" y="478" width="18" height="12" rx="3" fill="#e3efe9" stroke="#1f6f5c"/>
    <text x="154" y="488">主库（每类数据只存一处）</text>
    <line x1="130" y1="508" x2="148" y2="508" stroke="#1f6f5c" stroke-dasharray="5 4" stroke-width="1.5"/>
    <text x="154" y="512">供参考，不直接改译文</text>
    <line x1="130" y1="530" x2="148" y2="530" stroke="#a8641a" stroke-dasharray="5 4" stroke-width="1.5"/>
    <text x="154" y="534">反馈回流</text>
  </g>
</svg>
