# Quality-control baseline for `booklayout quality-gate` (issue #26).
# Every threshold is PROVISIONAL until calibrated against human-adjudicated
# chapters.  Changing a value requires a [[history]] entry below (date and
# calibration data).  The receipt records this file's sha256, so any change
# is visible in every later receipt.

[meta]
version = "0.1.0"
updated = "2026-11-19"
status = "provisional"

# --- OCR ---------------------------------------------------------------
# Evidence: docs/ocr_accuracy_baseline.md (2026-11-11, gold = ocr_verified,
# 278 pages): RapidOCR 300 dpi CER 0.0144, 200 dpi CER 0.0917.
[ocr.clean_300dpi]
provisional = true
evidence = "docs/ocr_accuracy_baseline.md"
cer_max = 0.01               # preferred: point estimate <= 1%
cer_acceptable_max = 0.02    # only with a documented per-page review plan
cer_ucb_ceiling = 0.03       # 95% Wilson upper bound may never exceed this
page_cer_max = 0.05          # no single page above this
critical_errors_max = 0      # numbers+units, taxon names, authorities, years
min_coverage = 1.0           # fraction of pages measured
min_sample_chars = 20000
min_reviewers = 1

# Difficult historical scans: no measured pilot yet -> gate is `indeterminate`.
[ocr.difficult_scan]
provisional = true
measured = false
evidence = ""

# --- Translation ---------------------------------------------------------
[translation.default]
provisional = true
evidence = "issue #26 provisional proposal; uncalibrated"
critical_max = 0
clean_lcb_min = 0.99         # 95% Wilson lower bound of segments free of Critical+Major
coverage_min = 0.98          # source-segment coverage
anchor_failures_max = 0      # numbers, Latin names, authorities, citation years
min_sample_segments = 300
min_reviewers = 2            # second-reviewer receipt required

[[history]]
date = "2026-11-19"
note = "initial provisional thresholds from issue #26 proposal; OCR evidence docs/ocr_accuracy_baseline.md"
